# cargo-deny baseline for iluhaAnime (2026-09-11, deny 0.20.2).
# Policy: vulnerabilities fail the gate; duplicate crate versions only warn
# (png, zip, reqwest, windows legs are pinned transitively and collapse via
# upstream only); unknown registries and git sources fail (lockfile is
# crates.io only). Licenses run on deny defaults; see DECISIONS.md entry.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  { id = "RUSTSEC-2025-0060", reason = "crypto-hash unmaintained, upstream-only via librqbit, no maintained swap available" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, upstream-only, maintainer unreachable" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property unmaintained, upstream-only via tauri/wry" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range unmaintained, upstream-only via tauri/wry" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common unmaintained, upstream-only via tauri/wry" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident unmaintained, upstream-only via tauri/wry" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version unmaintained, upstream-only via tauri/wry" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Unlicense",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
