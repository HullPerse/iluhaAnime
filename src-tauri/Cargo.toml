[package]
name = "iluhaAnime"
version = "6.0.0"
description = "Anime Tracker and Player"
authors = ["HullPerse"]
edition = "2021"
license = "MIT"
repository = "https://github.com/HullPerse/iluhaAnime"
readme = "README.md"
keywords = ["anime", "torrent", "player", "tauri"]
categories = ["multimedia::video", "multimedia::player"]
default-run = "iluhaAnime"

[features]
bench-api = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iluhaanime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "protocol-asset",
  "tray-icon",
  "image-png",
] }
tauri-plugin-opener = "2"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta-typescript = "=0.0.15"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
urlencoding = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
# Keep `bundled`: the shipped engine must not depend on a system SQLite DLL.
rusqlite = { version = "0.43", features = ["bundled"] }
# Keep defaults: rustls with platform verification, charset, HTTP/2 and system proxy.
reqwest = { version = "0.13", features = [
  "query",
  "form",
  "json",
  "cookies",
  "stream",
  "socks",
  "gzip",
  "brotli",
] }
futures = "0.3"
encoding_rs = "0.8"
ego-tree = "0.11"
scraper = "0.29"
regex-lite = "0.1"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
librqbit = { version = "9.1.0", default-features = false, features = [
  "default-tls",
  "http-api",
  "watch",
  "tracing-subscriber-utils",
] }
librqbit-bencode = "9.1.0"
librqbit-dualstack-sockets = "0.7"
tracing = "0.1"
anyhow = "1"
base64 = "0.23"
aes = "0.9"
aes-gcm = "0.11"
ctr = "0.10"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "io-util",
  "net",
  "sync",
  "process",
  "time",
] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
serde_bencode = "0.2"
serde_bytes = "0.11"
tauri-plugin-clipboard-manager = "2"
jwalk = "0.9"
# Direct dep so scans can run on a pool of their own instead of the global
# rayon pool that jwalk defaults to and torrent hashing also drives.
rayon = "1"
dashmap = "6"
notify = "9"
tauri-plugin-fs = "2"
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
keyring = "4"
tauri-plugin-window-state = { path = "vendor/tauri-plugin-window-state" }
sysinfo = "0.40"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
tauri-plugin-libmpv = { version = "0.3.2", path = "vendor/tauri-plugin-libmpv" }
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Foundation",
  "Media",
  "Win32_System_WinRT",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_HiDpi",
  "Win32_UI_Magnification",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
tauri-winrt-notification = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

