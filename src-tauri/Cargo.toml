[package]
name = "iluhaAnime"
version = "4.1.2"
description = "Anime Tracker and Player"
authors = ["HullPerse"]
edition = "2021"
license = "MIT"
repository = "https://github.com/HullPerse/iluhaAnime"
readme = "README.md"
keywords = ["anime", "torrent", "player", "tauri"]
categories = ["multimedia::video", "multimedia::player"]
default-run = "iluhaAnime"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iluhaanime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "socks"] }
futures = "0.3"
encoding_rs = "0.8"
scraper = "0.27"
regex-lite = "0.1"
sha1 = "0.10"
hex = "0.4"
librqbit = { version = "9.0.1", default-features = false, features = ["default-tls", "http-api", "watch", "tracing-subscriber-utils"] }
librqbit-bencode = "9.0.1"
librqbit-dualstack-sockets = "0.7"
tracing = "0.1"
anyhow = "1"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "sync", "process", "time"] }
zip = "2"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
serde_bencode = "0.2"
tauri-plugin-clipboard-manager = "2.3.2"
walkdir = "2"
dashmap = "6"
notify = "8"
tauri-plugin-fs = "2"
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
keyring = "4"
tauri-plugin-window-state = "2"
sysinfo = "0.39"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }
winreg = "0.52"
tauri-winrt-notification = "0.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[[bench]]
name = "anilist_queries"
harness = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple-crate-versions = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
too_many_arguments = "allow"
