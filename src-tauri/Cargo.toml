[dev-dependencies]
# Test-only response builder for the body-cap tests. Already in the
# lockfile through reqwest, so this adds no new supply-chain surface.
http = "1"
# Test-only local TLS fixture for the U3 reqwest matrix. Both crates are
# already resolved through reqwest/hyper-rustls; only the fixture certificate
# in tests/fixtures/tls is new, and it is never used by production code.
rustls = "0.23"
tokio-rustls = "0.26"

[patch.crates-io]
librqbit-dht = { path = "vendor/librqbit-dht" }
specta = { path = "vendor/specta" }
tauri-specta = { path = "vendor/tauri-specta" }
# Vendor copy of librqbit 9.1.0: payload files are written as <name>.part and
# renamed when finished, a fresh download parks in the .part twin, and the
# Windows sparse mark gets a valid lpBytesReturned outside the tracing macro.
# See vendor/librqbit/README-vendor.md for the patched files.
librqbit = { path = "vendor/librqbit" }
# librqbit-utp 0.7.0 is the newest release and still pins ringbuf 0.4, whose
# skip/clear are not panic-safe (RUSTSEC-2026-0293). The uTP code only uses
# SharedRb<Heap<u8>>, so the 0.5 API is a drop-in here.
librqbit-utp = { path = "vendor/librqbit-utp" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
